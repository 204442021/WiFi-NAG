[platformio]
default_envs =
    wifi_nag_ESP32_S3_CAN

[espidf6]
platform = platformio/espressif32@7.0.0
platform_packages =
    framework-espidf @ 4.60001.0

; WIFI-NAG: ESP32-S3 native TWAI CAN + Nag 0x370 echo + WebUI + DNS/AP+STA/NAPT.
[env:wifi_nag_ESP32_S3_CAN]
platform = ${espidf6.platform}
platform_packages = ${espidf6.platform_packages}
board = esp32s3box
framework = espidf
extra_scripts =
    pre:scripts/platformio_sync_profile.py
    post:scripts/platformio_wifi_nag_upload_offset.py
lib_deps = bblanchon/ArduinoJson@^7
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.wifi_nag.defaults"
build_flags =
    -I include
    -DDRIVER_TWAI
    -DESP32_DASHBOARD
    -DPRODUCT_WIFI_NAG=1
    -DDASH_WIFI_PERF_TUNING=1
    -DNAG_KILLER
    -DTWAI_TX_PIN=GPIO_NUM_15
    -DTWAI_RX_PIN=GPIO_NUM_16
    -DTWAI_RX_QUEUE_LEN=64
    -DTWAI_TX_QUEUE_LEN=1
    -DPIN_LED=14
    -DDASH_STA_AP_GATEWAY
    -DESP_IDF_LWIP_HOOK_FILENAME=\"lwip_hooks.h\"
    -std=gnu++17
build_unflags = -std=gnu++11
board_build.partitions = partitions_16mb_ota_4096k_nvs64_boot.csv
monitor_speed = 115200

[env:native_nag]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_flags = -std=c++17 -DNATIVE_BUILD -DNAG_KILLER
test_filter = test_native_nag

[env:native_twai]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_flags = -std=c++17 -DNATIVE_BUILD
test_filter = test_native_twai

[env:native_log_buffer]
platform = native
extra_scripts = pre:scripts/platformio_native_env.py
build_flags = -std=c++17 -DNATIVE_BUILD
test_filter = test_native_log_buffer
