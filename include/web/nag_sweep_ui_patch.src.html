<script>
(function(){
  'use strict';

  var cfg={minSec:5,maxSec:8};
  var saving=false;

  function zh(){return typeof dashLang!=='undefined'&&dashLang==='zh';}
  function text(cn,en){return zh()?cn:en;}
  function clamp(v){v=parseInt(v,10);if(!isFinite(v))v=5;return Math.max(1,Math.min(30,v));}
  function normalize(min,max){min=clamp(min);max=clamp(max);if(min>max){var t=min;min=max;max=t;}return{minSec:min,maxSec:max};}
  function byId(id){return document.getElementById(id);}

  function addStyle(){
    if(byId('nag-sweep-style'))return;
    var style=document.createElement('style');
    style.id='nag-sweep-style';
    style.textContent='.nag-sweep-grid{display:grid;grid-template-columns:minmax(72px,1fr) minmax(72px,1fr) auto;gap:6px;width:300px;max-width:100%;align-items:end}.nag-sweep-field{display:flex;flex-direction:column;gap:3px}.nag-sweep-field span{font-size:10px;color:var(--tx3);text-align:center}.nag-sweep-field .sniff-input{text-align:center}.nag-sweep-grid .sniff-btn{white-space:nowrap}@media(max-width:560px){body.wifi-nag #nag-sweep-row{flex-direction:column;align-items:stretch}.nag-sweep-grid{width:100%;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.nag-sweep-grid .sniff-btn{grid-column:1/-1;min-height:40px}.nag-sweep-field .sniff-input{min-height:40px;font-size:14px}}';
    document.head.appendChild(style);
  }

  function ensureRow(){
    var anchor=byId('can-write-row');
    if(!anchor)return false;
    addStyle();
    var row=byId('nag-sweep-row');
    if(!row){
      row=document.createElement('div');
      row.className='setting-row nag-only';
      row.id='nag-sweep-row';
      row.innerHTML='<div class="setting-info"><div class="setting-name" id="nag-sweep-name"></div><div class="setting-desc"><span id="nag-sweep-desc"></span> <span class="nag-status-pill" id="nag-sweep-meta"></span></div></div><div class="nag-sweep-grid"><label class="nag-sweep-field"><span id="nag-sweep-min-label"></span><input class="sniff-input" id="nag-sweep-min" type="number" min="1" max="30" step="1" value="5"></label><label class="nag-sweep-field"><span id="nag-sweep-max-label"></span><input class="sniff-input" id="nag-sweep-max" type="number" min="1" max="30" step="1" value="8"></label><button type="button" class="sniff-btn" id="nag-sweep-save"></button></div>';
      anchor.insertAdjacentElement('afterend',row);
      byId('nag-sweep-save').addEventListener('click',save);
      byId('nag-sweep-min').addEventListener('change',preview);
      byId('nag-sweep-max').addEventListener('change',preview);
    }
    render();
    return true;
  }

  function render(){
    if(!ensureRowBare())return;
    byId('nag-sweep-name').textContent=text('扫动时间','Sweep Time');
    byId('nag-sweep-desc').textContent=text('每次写入后在范围内随机等待；可设置 1–30 秒，默认 5–8 秒。','After each write, wait a random time in this range. Adjustable 1–30 s; default 5–8 s.');
    byId('nag-sweep-min-label').textContent=text('最短（秒）','Min (s)');
    byId('nag-sweep-max-label').textContent=text('最长（秒）','Max (s)');
    byId('nag-sweep-save').textContent=saving?text('保存中...','Saving...'):text('保存','Save');
    byId('nag-sweep-save').disabled=saving;
    var min=byId('nag-sweep-min'),max=byId('nag-sweep-max');
    if(document.activeElement!==min)min.value=cfg.minSec;
    if(document.activeElement!==max)max.value=cfg.maxSec;
    byId('nag-sweep-meta').textContent=text('当前：','Current: ')+cfg.minSec+'–'+cfg.maxSec+text(' 秒随机',' s random');
    patchModeText();
  }

  function ensureRowBare(){return !!byId('nag-sweep-row');}

  function preview(){
    var n=normalize(byId('nag-sweep-min').value,byId('nag-sweep-max').value);
    byId('nag-sweep-min').value=n.minSec;
    byId('nag-sweep-max').value=n.maxSec;
    byId('nag-sweep-meta').textContent=text('待保存：','Pending: ')+n.minSec+'–'+n.maxSec+text(' 秒',' s');
  }

  function apply(data){
    var n=normalize(data&&data.minSec,data&&data.maxSec);
    cfg=n;
    render();
  }

  function load(){
    fetch('/api/nag-sweep',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(apply).catch(function(e){
      if(typeof addLog==='function')addLog(text('扫动时间读取失败：','Sweep time load failed: ')+e.message,'le');
      render();
    });
  }

  function save(){
    if(saving)return;
    var n=normalize(byId('nag-sweep-min').value,byId('nag-sweep-max').value);
    saving=true;render();
    var body=new URLSearchParams();body.set('minSec',n.minSec);body.set('maxSec',n.maxSec);
    fetch('/api/nag-sweep',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(data){
      apply(data);if(typeof addLog==='function')addLog(text('扫动时间已保存：','Sweep time saved: ')+cfg.minSec+'–'+cfg.maxSec+'s','lc');
    }).catch(function(e){
      if(typeof addLog==='function')addLog(text('扫动时间保存失败：','Sweep time save failed: ')+e.message,'le');
    }).then(function(){saving=false;render();});
  }

  function patchModeText(){
    var meta=byId('nag-mode-meta');
    if(!meta)return;
    var mode=typeof state!=='undefined'?Number(state.nagMode||0):0;
    meta.textContent=mode===4?text('A_V2：随机扭矩','A_V2: random torque'):text('A：固定 +1.80 Nm echo','A: fixed +1.80 Nm echo');
  }

  function wrapGlobals(){
    if(typeof updateNagControl==='function'&&!updateNagControl.__nagSweepWrapped){
      var oldUpdate=updateNagControl;
      updateNagControl=function(d){var result=oldUpdate(d);patchModeText();return result;};
      updateNagControl.__nagSweepWrapped=true;
    }
    if(typeof toggleLanguage==='function'&&!toggleLanguage.__nagSweepWrapped){
      var oldToggle=toggleLanguage;
      toggleLanguage=function(){var result=oldToggle();setTimeout(render,0);return result;};
      toggleLanguage.__nagSweepWrapped=true;
    }
  }

  function init(){
    if(!ensureRow()){setTimeout(init,100);return;}
    wrapGlobals();
    load();
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  window.saveNagSweepRange=save;
})();
</script>
