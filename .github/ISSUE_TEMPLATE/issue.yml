name: WIFI-NAG Issue
description: Report a WIFI-NAG bug, feature request, or documentation issue
body:
  - type: textarea
    id: support_summary
    attributes:
      label: Support Request
      description: What do you need help with? If you copied dashboard logs or status output, paste them here first.
      placeholder: |
        Describe the problem, dashboard status, logs, and what you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Issue Type
      description: What type of issue is this?
      options:
        - Bug
        - Feature Request
        - Task
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: board
    attributes:
      label: Board / Hardware
      description: This repository maintains the WIFI-NAG ESP32-S3 TWAI build.
      options:
        - Waveshare ESP32-S3 RS485/CAN
        - Other / Unknown
    validations:
      required: true

  - type: input
    id: firmware_version
    attributes:
      label: Firmware Version
      description: Version shown in the WebUI or the build you flashed.
      placeholder: 2.6.0
    validations:
      required: false

  - type: input
    id: vehicle_software
    attributes:
      label: Vehicle Software Version
      description: Vehicle firmware version, if relevant to the issue.
      placeholder: 2026.8.3
    validations:
      required: false

  - type: dropdown
    id: can_write
    attributes:
      label: CAN Write State
      description: Was CAN Write enabled when the issue happened?
      options:
        - "Off / read-only"
        - "On"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: network
    attributes:
      label: WiFi / DNS / Gateway Details
      description: Fill this when the issue involves AP+STA, NAPT, DNS filtering, hotspot clients, or WebUI access.
      placeholder: |
        STA connected:
        AP clients:
        Gateway enabled:
        DNS mode / blacklist / whitelist:
        Symptoms:
    validations:
      required: false

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the issue.
      placeholder: Briefly describe the issue
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can this be reproduced? Include exact actions, buttons, or settings.
      placeholder: |
        1. Connect to WIFI-NAG AP
        2. Open WebUI
        3. Enable...
        4. See...

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Logs, screenshots, build output, or anything else
