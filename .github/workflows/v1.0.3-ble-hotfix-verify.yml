name: V1.0.3 BLE Dashboard Hotfix Verify

on:
  push:
    branches: ["V1.0.3-BLE后台热修复"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1.0.3-ble-dashboard-hotfix-verify-final
  cancel-in-progress: false

jobs:
  full-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=06c66b0083265397342ffd44bde0f0015f9f7b7b
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(tr -d '\r\n' < VERSION)" = "V1.0.3"
          git diff --check "$BASE"..HEAD
          git diff --name-only "$BASE"..HEAD | sort > /tmp/changed-files
          printf '%s\n' \
            '.github/workflows/v1.0.3-ble-hotfix-verify.yml' \
            'docs/superpowers/plans/2026-08-08-v1.0.3-ble-dashboard-hotfix.md' \
            'docs/superpowers/specs/2026-08-08-v1.0.3-ble-dashboard-hotfix-design.md' \
            'include/ble/bridge_webui.h' \
            'test/test_ble_dashboard_composition_regression.py' | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/changed-files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and image tools
        run: python -m pip install --upgrade pip platformio "esptool<5"

      - name: Create verification build profile
        env:
          WIFI_NAG_SSID: ${{ secrets.DASH_SSID }}
          WIFI_NAG_PASS: ${{ secrets.DASH_PASS }}
          WIFI_NAG_OTA_USER: ${{ secrets.DASH_OTA_USER }}
          WIFI_NAG_OTA_PASS: ${{ secrets.DASH_OTA_PASS }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          defaults = {
              "DASH_SSID": "EVtools",
              "DASH_PASS": "changeme",
              "DASH_OTA_USER": "admin",
              "DASH_OTA_PASS": "changeme",
          }
          environment = {
              "DASH_SSID": "WIFI_NAG_SSID",
              "DASH_PASS": "WIFI_NAG_PASS",
              "DASH_OTA_USER": "WIFI_NAG_OTA_USER",
              "DASH_OTA_PASS": "WIFI_NAG_OTA_PASS",
          }
          lines = ["#pragma once", ""]
          for macro, env_name in environment.items():
              value = os.environ.get(env_name) or defaults[macro]
              lines.append(f"#define {macro} {json.dumps(value, ensure_ascii=False)}")
          lines.extend(["", "// CAN Write stays disabled by default.", ""])
          Path("platformio_profile.h").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Run full automated test gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts test
          pio project config --json-output > /tmp/platformio-config.json
          test -s /tmp/platformio-config.json
          python -m unittest discover -s test -p "test_*regression.py" -v
          pio test -e native_nag
          pio test -e native_nag_sweep
          pio test -e native_twai
          pio test -e native_log_buffer
          pio test -e native_ble

      - name: Build ESP32-S3 verification firmware
        run: pio run -e wifi_nag_ESP32_S3_CAN

      - name: Verify firmware image
        shell: bash
        run: |
          set -euo pipefail
          test -s .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin
          python -m esptool --chip esp32s3 image_info .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin
          sha256sum .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin > /tmp/WIFI-NAG-V1.0.3-HOTFIX-VERIFY.sha256

      - name: Upload verification firmware
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-NAG-V1.0.3-BLE-Dashboard-Hotfix-Verify-Final
          path: |
            .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin
            /tmp/WIFI-NAG-V1.0.3-HOTFIX-VERIFY.sha256
          if-no-files-found: error
          retention-days: 14
