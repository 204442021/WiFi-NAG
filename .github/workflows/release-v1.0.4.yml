name: WIFI-NAG V1.0.4 Build and Release

on:
  push:
    branches: ["V1.0.4"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifi-nag-v1.0.4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V1.0.4
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and dashboard dependencies
        run: python -m pip install --upgrade pip platformio -r scripts/requirements-dashboard.txt

      - name: Create build profile
        env:
          WIFI_NAG_SSID: ${{ secrets.DASH_SSID }}
          WIFI_NAG_PASS: ${{ secrets.DASH_PASS }}
          WIFI_NAG_OTA_USER: ${{ secrets.DASH_OTA_USER }}
          WIFI_NAG_OTA_PASS: ${{ secrets.DASH_OTA_PASS }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          defaults = {
              "DASH_SSID": "EVtools",
              "DASH_PASS": "changeme",
              "DASH_OTA_USER": "admin",
              "DASH_OTA_PASS": "changeme",
          }
          environment = {
              "DASH_SSID": "WIFI_NAG_SSID",
              "DASH_PASS": "WIFI_NAG_PASS",
              "DASH_OTA_USER": "WIFI_NAG_OTA_USER",
              "DASH_OTA_PASS": "WIFI_NAG_OTA_PASS",
          }
          lines = ["#pragma once", ""]
          for macro, env_name in environment.items():
              value = os.environ.get(env_name) or defaults[macro]
              lines.append(f"#define {macro} {json.dumps(value, ensure_ascii=False)}")
          lines.extend(["", "// CAN Write stays disabled by default.", ""])
          Path("platformio_profile.h").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Run Python regression tests
        run: python -m unittest discover -s test -p "test_*.py" -v

      - name: Verify generated dashboard payload
        run: python scripts/minify_dashboard.py --check

      - name: Run native Nag tests
        run: pio test -e native_nag

      - name: Run native Nag sweep tests
        run: pio test -e native_nag_sweep

      - name: Run native TWAI tests
        run: pio test -e native_twai

      - name: Run native log-buffer tests
        run: pio test -e native_log_buffer

      - name: Run native BLE tests
        run: pio test -e native_ble

      - name: Build ESP32-S3 firmware
        run: pio run -e wifi_nag_ESP32_S3_CAN

      - name: Verify firmware version
        run: test "$(tr -d '\r\n' < VERSION)" = "V1.0.4"

      - name: Prepare verified release assets
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          test -s .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin
          cp .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin dist/WIFI-NAG-V1.0.4-OTA.bin
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" \
            --chip esp32s3 merge_bin \
            -o dist/WIFI-NAG-V1.0.4-FACTORY-16MB.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            --fill-flash-size 16MB \
            0x0 .pio/build/wifi_nag_ESP32_S3_CAN/bootloader.bin \
            0x8000 .pio/build/wifi_nag_ESP32_S3_CAN/partitions.bin \
            0x19000 .pio/build/wifi_nag_ESP32_S3_CAN/ota_data_initial.bin \
            0x20000 .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin
          test "$(stat -c%s dist/WIFI-NAG-V1.0.4-FACTORY-16MB.bin)" -eq 16777216
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          dist = Path("dist")
          ota = dist / "WIFI-NAG-V1.0.4-OTA.bin"
          factory = dist / "WIFI-NAG-V1.0.4-FACTORY-16MB.bin"
          guide = dist / "WIFI-NAG-V1.0.4-FLASH-GUIDE.txt"
          manifest = dist / "WIFI-NAG-V1.0.4-MANIFEST.json"

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          guide.write_text(
              "\n".join(
                  [
                      "WIFI-NAG V1.0.4 固件使用说明",
                      "",
                      f"正式源码 SHA：{os.environ['SOURCE_SHA']}",
                      "目标芯片：ESP32-S3",
                      "Flash 容量：16MB",
                      "",
                      "一、OTA 升级",
                      "文件：WIFI-NAG-V1.0.4-OTA.bin",
                      "通过 WIFI-NAG 后台的本地 OTA 上传页面升级。",
                      "OTA 只写入应用分区，通常保留 NVS 和设备设置。",
                      "",
                      "二、USB/UART 线刷",
                      "文件：WIFI-NAG-V1.0.4-FACTORY-16MB.bin",
                      "这是从地址 0x0 开始写入的 16MB 完整镜像。",
                      "完整线刷会覆盖整片 Flash，并清除旧 NVS、Wi-Fi、绑定和历史设置。",
                      "",
                      "示例命令：",
                      "esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 WIFI-NAG-V1.0.4-FACTORY-16MB.bin",
                      "",
                      "刷写完成后断电重启，并重新配置设备。",
                      "请先用 WIFI-NAG-V1.0.4-SHA256SUMS.txt 校验文件完整性。",
                      "",
                  ]
              ),
              encoding="utf-8",
          )

          payload = {
              "product": "WIFI-NAG",
              "version": "V1.0.4",
              "source_sha": os.environ["SOURCE_SHA"],
              "build_environment": "wifi_nag_ESP32_S3_CAN",
              "built_at_utc": datetime.now(timezone.utc).isoformat(),
              "flash_chip": "ESP32-S3",
              "flash_size_bytes": 16 * 1024 * 1024,
              "ota": {
                  "file": ota.name,
                  "size": ota.stat().st_size,
                  "sha256": sha256(ota),
                  "application_offset": "0x20000",
              },
              "factory": {
                  "file": factory.name,
                  "size": factory.stat().st_size,
                  "sha256": sha256(factory),
                  "write_offset": "0x0",
                  "segments": [
                      {"offset": "0x0", "source": "bootloader.bin"},
                      {"offset": "0x8000", "source": "partitions.bin"},
                      {"offset": "0x19000", "source": "ota_data_initial.bin"},
                      {"offset": "0x20000", "source": "firmware.bin"},
                  ],
              },
          }
          manifest.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          release_notes = Path("RELEASE_NOTES_V1.0.4.md").read_text(encoding="utf-8")
          release_notes += "\n\n## 已验证发布产物\n\n"
          release_notes += f"- 正式源码 SHA：`{os.environ['SOURCE_SHA']}`\n"
          release_notes += "- Python 回归、5 个 native 测试环境、ESP32-S3 正式编译：全部通过\n"
          release_notes += "- OTA、16MB Factory、Manifest、刷写说明与 SHA256 校验文件：已生成并校验\n"
          (dist / "RELEASE_BODY.md").write_text(release_notes, encoding="utf-8")
          PY
          (cd dist && sha256sum \
            WIFI-NAG-V1.0.4-OTA.bin \
            WIFI-NAG-V1.0.4-FACTORY-16MB.bin \
            WIFI-NAG-V1.0.4-MANIFEST.json \
            WIFI-NAG-V1.0.4-FLASH-GUIDE.txt \
            > WIFI-NAG-V1.0.4-SHA256SUMS.txt)

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-NAG-V1.0.4
          path: |
            dist/WIFI-NAG-V1.0.4-OTA.bin
            dist/WIFI-NAG-V1.0.4-FACTORY-16MB.bin
            dist/WIFI-NAG-V1.0.4-FLASH-GUIDE.txt
            dist/WIFI-NAG-V1.0.4-MANIFEST.json
            dist/WIFI-NAG-V1.0.4-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish V1.0.4 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: V1.0.4
        run: |
          ASSETS=(
            dist/WIFI-NAG-V1.0.4-OTA.bin
            dist/WIFI-NAG-V1.0.4-FACTORY-16MB.bin
            dist/WIFI-NAG-V1.0.4-FLASH-GUIDE.txt
            dist/WIFI-NAG-V1.0.4-MANIFEST.json
            dist/WIFI-NAG-V1.0.4-SHA256SUMS.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "WIFI-NAG V1.0.4" --notes-file dist/RELEASE_BODY.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "WIFI-NAG V1.0.4" \
              --notes-file dist/RELEASE_BODY.md
          fi
