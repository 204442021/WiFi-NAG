name: WIFI-NAG V1.0.2 Build and Release

on:
  push:
    branches: ["V1.0.2"]
  pull_request:
    branches: ["V1.0.1"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifi-nag-v1.0.2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V1.0.2
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Create build profile
        env:
          WIFI_NAG_SSID: ${{ secrets.DASH_SSID }}
          WIFI_NAG_PASS: ${{ secrets.DASH_PASS }}
          WIFI_NAG_OTA_USER: ${{ secrets.DASH_OTA_USER }}
          WIFI_NAG_OTA_PASS: ${{ secrets.DASH_OTA_PASS }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          defaults = {
              "DASH_SSID": "EVtools",
              "DASH_PASS": "changeme",
              "DASH_OTA_USER": "admin",
              "DASH_OTA_PASS": "changeme",
          }
          environment = {
              "DASH_SSID": "WIFI_NAG_SSID",
              "DASH_PASS": "WIFI_NAG_PASS",
              "DASH_OTA_USER": "WIFI_NAG_OTA_USER",
              "DASH_OTA_PASS": "WIFI_NAG_OTA_PASS",
          }
          lines = ["#pragma once", ""]
          for macro, env_name in environment.items():
              value = os.environ.get(env_name) or defaults[macro]
              lines.append(f"#define {macro} {json.dumps(value, ensure_ascii=False)}")
          lines.extend(["", "// CAN Write stays disabled by default.", ""])
          Path("platformio_profile.h").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Run Python regression tests
        run: python -m unittest discover -s test -p "test_*regression.py" -v

      - name: Run native Nag tests
        run: pio test -e native_nag

      - name: Run native TWAI tests
        run: pio test -e native_twai

      - name: Run native log-buffer tests
        run: pio test -e native_log_buffer

      - name: Build ESP32-S3 OTA firmware
        run: pio run -e wifi_nag_ESP32_S3_CAN

      - name: Read firmware version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        if: steps.version.outputs.value == 'V1.0.2'
        run: |
          mkdir -p dist
          test -s .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin
          cp .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin dist/WIFI-NAG-V1.0.2-OTA.bin

      - name: Upload verified OTA artifact
        if: steps.version.outputs.value == 'V1.0.2'
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-NAG-V1.0.2-OTA
          path: dist/WIFI-NAG-V1.0.2-OTA.bin
          if-no-files-found: error
          retention-days: 30

      - name: Publish V1.0.2 release
        if: >-
          steps.version.outputs.value == 'V1.0.2' &&
          (github.event_name == 'push' || github.event.pull_request.head.ref == 'V1.0.2')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: V1.0.2
          ASSET: dist/WIFI-NAG-V1.0.2-OTA.bin
          NOTES: RELEASE_NOTES_V1.0.2.md
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -s "$ASSET"
          test -s "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "WIFI-NAG V1.0.2" --notes-file "$NOTES"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$RELEASE_TARGET" \
              --title "WIFI-NAG V1.0.2" \
              --notes-file "$NOTES"
          fi
