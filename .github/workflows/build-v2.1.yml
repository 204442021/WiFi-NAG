name: WIFI-NAG V2.1 Firmware Build

on:
  push:
    branches: ["V2.1"]
    paths-ignore:
      - ".github/build-results/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifi-nag-v2.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V2.1
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio==6.1.18

      - name: Configure fixed credentials
        run: cp platformio_profile.example.h platformio_profile.h

      - name: Verify generated dashboard
        run: |
          pip install htmlmin2 rcssmin rjsmin
          python scripts/minify_dashboard.py --check

      - name: Build ESP32-S3 firmware
        run: pio run -e wifi_nag_ESP32_S3_CAN

      - name: Package OTA and 16MiB factory images
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_ENV}"
          mkdir -p dist
          OTA="dist/WIFI-NAG-V2.1-${SHORT_SHA}-OTA.bin"
          FACTORY="dist/WIFI-NAG-V2.1-${SHORT_SHA}-Factory-16MiB.bin"
          cp .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin "${OTA}"
          python "${HOME}/.platformio/packages/tool-esptoolpy/esptool.py" \
            --chip esp32s3 merge_bin \
            -o "${FACTORY}" \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            --fill-flash-size 16MB \
            0x0 .pio/build/wifi_nag_ESP32_S3_CAN/bootloader.bin \
            0x8000 .pio/build/wifi_nag_ESP32_S3_CAN/partitions.bin \
            0x19000 .pio/build/wifi_nag_ESP32_S3_CAN/ota_data_initial.bin \
            0x20000 .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin
          test "$(stat -c%s "${FACTORY}")" -eq 16777216
          sha256sum "${OTA}" "${FACTORY}" > "dist/SHA256SUMS-V2.1-${SHORT_SHA}.txt"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-NAG-V2.1-${{ env.SHORT_SHA }}-firmware
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Record build run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/build-results
          printf 'run_id=%s\ncommit=%s\nartifact=WIFI-NAG-V2.1-%s-firmware\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${SHORT_SHA}" \
            > .github/build-results/V2.1-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-results/V2.1-run.txt
          git commit -m "chore(ci): record V2.1 firmware build [skip ci]"
          git push origin HEAD:V2.1
