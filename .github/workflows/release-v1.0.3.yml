name: WIFI-NAG V1.0.3 Build and Release

on:
  push:
    branches: ["V1.0.3-正式编译发布"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifi-nag-v1.0.3-final-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: V1.0.3
  RELEASE_TARGET: 06c66b0083265397342ffd44bde0f0015f9f7b7b
  BUILD_ENV: wifi_nag_ESP32_S3_CAN

jobs:
  test-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout isolated release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$RELEASE_TARGET")" = "$RELEASE_TARGET"
          test "$(git rev-parse origin/V1.0.3)" = "$RELEASE_TARGET"
          git diff --name-only "$RELEASE_TARGET" HEAD | sort > /tmp/changed-files
          printf '%s\n' \
            '.github/workflows/release-v1.0.3.yml' \
            'scripts/release_v1_0_3_images.py' | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/changed-files
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          git diff --check 760744655191998239cc8447732e9fe4e2d889c8.."$RELEASE_TARGET"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and image tools
        run: python -m pip install --upgrade pip platformio "esptool<5"

      - name: Create release build profile
        env:
          WIFI_NAG_SSID: ${{ secrets.DASH_SSID }}
          WIFI_NAG_PASS: ${{ secrets.DASH_PASS }}
          WIFI_NAG_OTA_USER: ${{ secrets.DASH_OTA_USER }}
          WIFI_NAG_OTA_PASS: ${{ secrets.DASH_OTA_PASS }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          defaults = {
              "DASH_SSID": "EVtools",
              "DASH_PASS": "changeme",
              "DASH_OTA_USER": "admin",
              "DASH_OTA_PASS": "changeme",
          }
          environment = {
              "DASH_SSID": "WIFI_NAG_SSID",
              "DASH_PASS": "WIFI_NAG_PASS",
              "DASH_OTA_USER": "WIFI_NAG_OTA_USER",
              "DASH_OTA_PASS": "WIFI_NAG_OTA_PASS",
          }
          lines = ["#pragma once", ""]
          for macro, env_name in environment.items():
              value = os.environ.get(env_name) or defaults[macro]
              lines.append(f"#define {macro} {json.dumps(value, ensure_ascii=False)}")
          lines.extend(["", "// CAN Write stays disabled by default.", ""])
          Path("platformio_profile.h").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Run full automated test gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts test
          pio project config --json-output > /tmp/platformio-config.json
          test -s /tmp/platformio-config.json
          python -m unittest discover -s test -p "test_*regression.py" -v
          pio test -e native_nag
          pio test -e native_nag_sweep
          pio test -e native_twai
          pio test -e native_log_buffer
          pio test -e native_ble

      - name: Build ESP32-S3 firmware
        run: pio run -e "$BUILD_ENV"

      - name: Generate OTA and 16MB factory images
        id: images
        run: python scripts/release_v1_0_3_images.py

      - name: Verify release binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.images.outputs.ota }}"
          test -s "${{ steps.images.outputs.factory }}"
          test "$(stat -c %s "${{ steps.images.outputs.factory }}")" -eq 16777216
          test -s "${{ steps.images.outputs.manifest }}"
          test -s "${{ steps.images.outputs.checksums }}"
          test -s "${{ steps.images.outputs.guide }}"
          test -s "${{ steps.images.outputs.release_notes }}"
          cd dist
          sha256sum -c "$(basename "${{ steps.images.outputs.checksums }}")"
          cd ..
          python -m esptool --chip esp32s3 image_info "${{ steps.images.outputs.ota }}"

      - name: Upload verified firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: WIFI-NAG-V1.0.3-Firmware
          path: |
            ${{ steps.images.outputs.ota }}
            ${{ steps.images.outputs.factory }}
            ${{ steps.images.outputs.manifest }}
            ${{ steps.images.outputs.checksums }}
            ${{ steps.images.outputs.guide }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: V1.0.3
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "${{ steps.images.outputs.ota }}"
            "${{ steps.images.outputs.factory }}"
            "${{ steps.images.outputs.manifest }}"
            "${{ steps.images.outputs.checksums }}"
            "${{ steps.images.outputs.guide }}"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" \
              --title "WIFI-NAG V1.0.3" \
              --notes-file "${{ steps.images.outputs.release_notes }}" \
              --latest
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$RELEASE_TARGET" \
              --title "WIFI-NAG V1.0.3" \
              --notes-file "${{ steps.images.outputs.release_notes }}" \
              --latest
          fi

      - name: Verify published tag and assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: V1.0.3
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$RELEASE_TARGET"
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,assets > /tmp/release.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/release.json").read_text(encoding="utf-8"))
          assert data["tagName"] == "V1.0.3"
          assert data["name"] == "WIFI-NAG V1.0.3"
          assert not data["isDraft"]
          assert not data["isPrerelease"]
          names = {asset["name"] for asset in data["assets"]}
          required = {
              "WIFI-NAG-V1.0.3-OTA.bin",
              "WIFI-NAG-V1.0.3-FACTORY-16MB.bin",
              "WIFI-NAG-V1.0.3-MANIFEST.json",
              "WIFI-NAG-V1.0.3-SHA256SUMS.txt",
              "WIFI-NAG-V1.0.3-FLASH-GUIDE.txt",
          }
          missing = required - names
          assert not missing, f"missing release assets: {sorted(missing)}"
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
