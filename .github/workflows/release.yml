name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.1.19"

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential git
      - run: pip install "platformio==${PLATFORMIO_VERSION}"
      - run: cp platformio_profile.example.h platformio_profile.h
      - run: pio run -e wifi_nag_ESP32_S3_CAN
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-wifi-nag-esp32-s3
          path: .pio/build/wifi_nag_ESP32_S3_CAN/firmware.bin

  release:
    needs:
      - firmware-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Rename firmware file
        run: mv release-assets/firmware-wifi-nag-esp32-s3/firmware.bin release-assets/firmware-wifi-nag-esp32-s3.bin
      - name: Extract changelog section for this tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          awk -v v="$VER" 'BEGIN{f=0} /^## \[/{ if(f) exit; if($0 ~ "^## \\[" v "\\]") { f=1; print; next } } f { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${TAG}" > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name,
            'alpha') || contains(github.ref_name, 'rc') }}
          draft: true
          files: release-assets/firmware-wifi-nag-esp32-s3.bin
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
